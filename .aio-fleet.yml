components:
  aio:
    image_name: jsonbored/sure-aio
    dockerfile: Dockerfile
    upstream_config: upstream.toml
    docker_cache_scope: sure-aio-image
    oci_description: Stable Unraid-first Sure AIO image
    release_suffix: aio
    floating_tags:
      - latest
    xml_paths:
      - sure-aio.xml
  sure-alpha:
    image_name: jsonbored/sure-aio-alpha
    dockerfile: Dockerfile.alpha
    upstream_config: upstream.toml
    docker_cache_scope: sure-aio-alpha-image
    oci_description: Unstable Unraid-first Sure AIO alpha testing image
    release_policy: registry_only
    release_history: github_prerelease
    release_changelog: CHANGELOG.alpha.md
    release_tag_prefix: sure-alpha/
    release_suffix: aio
    registry_revision_arg: AIO_REVISION
    github_release_latest: false
    release_customization_notes:
      - Preserve the Sure AIO alpha import-limit overlay documented in `docs/alpha-lane.md`.
      - Preserve the strict SureImport preflight/failure overlay until the pinned
        upstream alpha includes equivalent behavior.
      - Preserve the route-parity importer overlay for Enhanced NDJSON split/transfer
        proof packages until upstream carries it.
      - Keep `SURE_IMPORT_MAX_NDJSON_SIZE_MB` and `SURE_IMPORT_MAX_ROWS` alpha-only.
      - Do not add dirty-target taxonomy merge as a Unraid template or environment
        control.
      - Keep alpha passkey/WebAuthn template controls separate from stable.
    floating_tags:
      - latest-alpha
    smoke_test:
      enabled: true
    include_upstream_version_tag: false
    include_sha_tag: false
    preserve_tags:
      - jsonbored/sure-aio:latest
      - ghcr.io/jsonbored/sure-aio:latest
    upstream_version_key: UPSTREAM_VERSION
    xml_paths:
      - sure-aio-alpha.xml
    publish_paths:
      - README.md
      - pyproject.toml
      - rootfs-alpha/**
      - patches/sure-alpha/**
      - docs/alpha-lane.md
      - docs/releases.md
      - tests/**
    pytest_image_tag: sure-aio-alpha:pytest
    pytest_prebuilt_env: AIO_ALPHA_PYTEST_USE_PREBUILT_IMAGE
    validation:
      required_targets:
        - SURE_IMPORT_MAX_NDJSON_SIZE_MB
        - SURE_IMPORT_MAX_ROWS
        - WEBAUTHN_RP_ID
        - WEBAUTHN_ALLOWED_ORIGINS
      required_field_values:
        Name: sure-aio-alpha
        Repository: jsonbored/sure-aio-alpha:latest-alpha
        Beta: "True"
      required_text_snippets:
        - Testing / Unstable
        - Alpha-only
        - /mnt/user/appdata/sure-aio-alpha
        - latest-alpha
      forbidden_text_snippets:
        - <Name>sure-aio</Name>
        - <Repository>jsonbored/sure-aio:latest</Repository>
        - /mnt/user/appdata/sure-aio/system
        - /mnt/user/appdata/sure-aio/postgres
        - /mnt/user/appdata/sure-aio/redis
      config_target_requirements:
        SURE_IMPORT_MAX_NDJSON_SIZE_MB:
          name_contains: "[Alpha]"
          description_contains: Alpha-only
          default: "250"
          value: "250"
        SURE_IMPORT_MAX_ROWS:
          name_contains: "[Alpha]"
          description_contains: Alpha-only
          default: "1000000"
          value: "1000000"
        WEBAUTHN_RP_ID:
          name_contains: "[Alpha Auth]"
          description_contains: Alpha-only
        WEBAUTHN_ALLOWED_ORIGINS:
          name_contains: "[Alpha Auth]"
          description_contains: Alpha-only
