schema_version: 1
repo: sure-aio
github_repo: JSONbored/sure-aio
app_slug: sure-aio
image:
  name: jsonbored/sure-aio
  cache_scope: sure-aio-image
  pytest_tag: sure-aio:pytest
  publish_platforms: linux/amd64,linux/arm64
release:
  name: Sure-AIO
  profile: upstream-aio-track
  previous_tag_command: latest-aio-tag
upstream:
  name: Sure
  version_key: UPSTREAM_VERSION
  digest_arg: UPSTREAM_IMAGE_DIGEST
  monitor:
    - component: aio
      name: Sure
      source: github-releases
      repo: we-promise/sure
      image: we-promise/sure
      digest_source: ghcr
      dockerfile: Dockerfile
      version_key: UPSTREAM_VERSION
      version_strip_prefix: v
      digest_key: UPSTREAM_IMAGE_DIGEST
      stable_only: true
      strategy: pr
      release_notes_url: https://github.com/we-promise/sure/releases
    - component: sure-alpha
      name: Sure Alpha
      source: github-releases
      repo: we-promise/sure
      image: we-promise/sure
      digest_source: ghcr
      dockerfile: Dockerfile.alpha
      version_key: UPSTREAM_VERSION
      version_strip_prefix: v
      digest_key: UPSTREAM_IMAGE_DIGEST
      stable_only: false
      prerelease_channel: alpha
      strategy: pr
      release_notes_url: https://github.com/we-promise/sure/releases
template:
  xml_paths:
    - sure-aio.xml
    - sure-aio-alpha.xml
  generated: false
catalog:
  published: true
  assets:
    - source: sure-aio.xml
      target: sure-aio.xml
    - source: sure-aio-alpha.xml
      target: sure-aio-alpha.xml
    - source: screenshots/sure-aio/01-dashboard.png
      target: screenshots/sure-aio/01-dashboard.png
    - source: screenshots/sure-aio/02-account-activity.png
      target: screenshots/sure-aio/02-account-activity.png
    - source: screenshots/sure-aio/03-budgets.png
      target: screenshots/sure-aio/03-budgets.png
    - source: screenshots/sure-aio-alpha/01-login.png
      target: screenshots/sure-aio-alpha/01-login.png
    - source: screenshots/sure-aio-alpha/02-account-activity.png
      target: screenshots/sure-aio-alpha/02-account-activity.png
    - source: screenshots/sure-aio-alpha/03-budgets.png
      target: screenshots/sure-aio-alpha/03-budgets.png
tests:
  integration: tests/integration -m integration
  checkout_submodules: false
