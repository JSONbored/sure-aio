name: CI / Sure-AIO

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".github/workflows/**"
      - ".trunk/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "README.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "assets/**"
      - "cliff.toml"
      - "components.toml"
      - "components/**"
      - "docs/**"
      - "docs/upstream/**"
      - "pyproject.toml"
      - "renovate.json"
      - "requirements-dev.txt"
      - "rootfs/**"
      - "scripts/**"
      - "sure-aio.xml"
      - "tests/**"
      - "upstream.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
      - ".github/workflows/**"
      - ".trunk/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "README.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "assets/**"
      - "cliff.toml"
      - "components.toml"
      - "components/**"
      - "docs/**"
      - "docs/upstream/**"
      - "pyproject.toml"
      - "renovate.json"
      - "requirements-dev.txt"
      - "rootfs/**"
      - "scripts/**"
      - "sure-aio.xml"
      - "tests/**"
      - "upstream.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aio-build:
    uses: JSONbored/aio-fleet/.github/workflows/aio-build.yml@01163d070460034ea975df7b57d34b6178f33e97
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      app_slug: sure-aio
      image_name: jsonbored/sure-aio
      workflow_title: CI / Sure-AIO
      docker_cache_scope: sure-aio-image
      pytest_image_tag: sure-aio:pytest
      publish_profile: upstream-aio-track
      upstream_name: Sure
      image_description: Unraid-first AIO wrapper image for Sure (web, worker, postgres, redis)
      python_version: "3.13"
      trunk_org_slug: aethereal
      publish_platforms: linux/amd64,linux/arm64
      checkout_submodules: false
      integration_pytest_args: tests/integration -m integration
      run_extended_integration: false
      extended_integration_pytest_args: ""
      generator_check_command: ""
      upstream_digest_arg: UPSTREAM_IMAGE_DIGEST
      catalog_published: true
      xml_paths: |
        sure-aio.xml
      extra_publish_paths: |

      catalog_assets: |
        sure-aio.xml|sure-aio.xml
    secrets: inherit
